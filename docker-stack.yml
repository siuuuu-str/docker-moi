version: '3.8'

services:
  web:
    image: dockerpr-web:latest  # Используем образ, который собрали ранее
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://user:pass@db:5432/mydb
    networks:
      - frontend
      - backend
    deploy:
      replicas: 3  # Запускаем 3 копии (как требует задание)
      restart_policy:
        condition: on-failure

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: mydb
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend

networks:
  frontend:
  backend:

volumes:
  db_data: